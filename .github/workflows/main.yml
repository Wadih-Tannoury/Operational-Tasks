name: Commercial Invoice Upload for ICO

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      API_CREDENTIALS_JSON: ${{ secrets.API_CREDENTIALS_JSON }}
      BQ_CREDENTIALS_JSON: ${{ secrets.BQ_CREDENTIALS_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-cloud-bigquery google-auth

      - name: Run script
        run: python "commercial invoice upload for ICO.py"
