name: Commercial Invoice Upload for ICO

on:
  workflow_dispatch:

concurrency:
  group: scheduled-worker
  cancel-in-progress: false

jobs:
  run-commercial-invoice-script:
    runs-on: ubuntu-latest

    env:
      KIBO_API_CREDENTIALS: ${{ secrets.KIBO_API_CREDENTIALS }}
      TIL_BIGQUERY_CREDS: ${{ secrets.TIL_BIGQUERY_CREDS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-cloud-bigquery google-auth

      - name: Run commercial invoice script
        run: python "commercial invoice upload for ICO.py"
